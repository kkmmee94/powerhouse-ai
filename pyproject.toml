[project]
name = "powerhouse-ai"
version = "0.1.0"
description = "A private, VRAM-constrained modular AI runtime for consumer GPUs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kkmmee94" }]
keywords = ["local-ai", "llama-cpp", "nvidia", "rag", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=1.0,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<16",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/kkmmee94/powerhouse-ai"
Documentation = "https://github.com/kkmmee94/powerhouse-ai/tree/main/docs"
Issues = "https://github.com/kkmmee94/powerhouse-ai/issues"
Repository = "https://github.com/kkmmee94/powerhouse-ai"

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
powerhouse = "powerhouse_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerhouse_ai"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["powerhouse_ai"]

[tool.coverage.report]
fail_under = 80
show_missing = true
